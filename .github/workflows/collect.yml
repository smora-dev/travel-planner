name: Buscar precios

on:
  schedule:
    - cron: "17 8 * * *"  # 2:17 a.m. Costa Rica (minuto impar: GitHub se salta menos)
  workflow_dispatch:      # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency: collect

jobs:
  # La lista de destinos sale de config.json: agregar uno ahí basta.
  setup:
    runs-on: ubuntu-latest
    outputs:
      dests: ${{ steps.d.outputs.dests }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: echo "dests=$(jq -c '[.destinations[].id]' config.json)" >> $GITHUB_OUTPUT

  # Un destino por máquina: cada una tiene otra IP, así Google no bloquea tan rápido.
  collect:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5   # menos máquinas a la vez = Google bloquea menos
      matrix:
        dest: ${{ fromJson(needs.setup.outputs.dests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - name: Instalar fuentes (viajante, fli, trvl)
        run: |
          pip install -q viajante flights click
          for i in 1 2 3; do go install github.com/MikkoParkkola/trvl/cmd/trvl@latest && break; sleep 20; done
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - run: PAUSE=0 python test_collector.py
      - name: Buscar precios ${{ matrix.dest }}
        run: python collector.py ${{ matrix.dest }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.dest }}
          path: data/parts/

  merge:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: data/parts/
          merge-multiple: true
      - name: Unir resultados
        run: python collector.py --merge
      - name: Guardar resultados
        run: |
          git config user.name "travel-agent"
          git config user.email "travel-agent@users.noreply.github.com"
          git add data/latest.json data/history.csv
          git diff --cached --quiet || git commit -m "Precios $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 10; done
