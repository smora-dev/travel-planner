name: Probar fuentes MCP
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/mcp_probe.py https://piqod.it/mcp https://mcp.tickadoo.com/mcp https://mcp.tripways.com/mcp https://mcp.octotrip.app/rental-cars/mcp
